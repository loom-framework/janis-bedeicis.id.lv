<!DOCTYPE html>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <meta name="author" content="Jānis Bedeicis" />
    <meta name="keywords" content="Jānis Bedeicis" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Jānis Bedeicis" />
    <meta property="og:description" content="Mārketinga Projektu Plānotājs" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.janis-bedeicis.id.lv" />
    <meta property="og:image" content="https://www.janis-bedeicis.id.lv/BIZNESA%20KONTAKTKARTE%20-%20J%C4%80NIS%20BEDEICIS.jpeg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jānis Bedeicis" />
    <meta name="twitter:description" content="Mārketinga Projektu Plānotājs" />
    <meta name="twitter:image" content="https://www.janis-bedeicis.id.lv/BIZNESA_KONTAKTKARTE_JANIS_BEDEICIS.png" />

    <!-- Standard favicon -->
    <link rel="icon" href="/assets/icons/favicon.ico" sizes="any" />

    <!-- PNG icons -->
    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="/assets/icons/favicon-32x32.png"
    />

    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="/assets/icons/favicon-16x16.png"
    />

    <!-- Apple Touch Icon -->
    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="/assets/icons/apple-touch-icon.png"
    />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Safari pinned tab -->
    <link
        rel="mask-icon"
        href="/assets/icons/safari-pinned-tab.svg"
        color="#000000"
    />

    <!-- Theme color -->
    <meta
        name="theme-color"
        content="#ffffff"
        media="(prefers-color-scheme: light)"
    />

    <meta
        name="theme-color"
        content="#121212"
        media="(prefers-color-scheme: dark)"
    />

    <meta name="color-scheme" content="light dark" />

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #ffffff;
        }

        .pdf-container {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .pdf-page {
            display: block;
            width: 100%;
            height: auto;
            margin: 0;
            padding: 0;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 16px;
            z-index: 10;
        }

        #error {
            display: none;
            padding: 30px;
            font-family: Arial, sans-serif;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="loading">
        Ielādē...
    </div>

    <div id="error">
        Neizdevās ielādēt dokumentu.
    </div>

    <main
        class="pdf-container"
        id="pdf-container"
    ></main>

    <!-- PDF.js -->
    <script type="module">

        const PDF_URL =
            "https://www.janis-bedeicis.id.lv/BIZNESA_KONTAKTKARTE_JANIS_BEDEICIS.pdf";

        const container =
            document.getElementById("pdf-container");

        const loading =
            document.getElementById("loading");

        const error =
            document.getElementById("error");

        try {

            const pdfjsLib =
                await import(
                    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.54/pdf.min.mjs"
                );

            pdfjsLib.GlobalWorkerOptions.workerSrc =
                "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.54/pdf.worker.min.mjs";

            const pdf =
                await pdfjsLib.getDocument(PDF_URL).promise;

            for (
                let pageNumber = 1;
                pageNumber <= pdf.numPages;
                pageNumber++
            ) {

                const page =
                    await pdf.getPage(pageNumber);

                const originalViewport =
                    page.getViewport({
                        scale: 1
                    });

                // Scale PDF to 100% browser width
                const scale =
                    window.innerWidth /
                    originalViewport.width;

                const viewport =
                    page.getViewport({
                        scale: scale
                    });

                const canvas =
                    document.createElement("canvas");

                canvas.className =
                    "pdf-page";

                const context =
                    canvas.getContext("2d");

                canvas.width =
                    viewport.width;

                canvas.height =
                    viewport.height;

                container.appendChild(canvas);

                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;
            }

            loading.style.display = "none";

        } catch (err) {

            console.error(
                "PDF loading error:",
                err
            );

            loading.style.display = "none";
            error.style.display = "block";
        }

    </script>

</body>
</html>
