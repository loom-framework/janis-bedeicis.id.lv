    <!-- PDF.js -->
    <script type="module">

        const PDF_URL =
            "https://www.janis-bedeicis.id.lv/cenas/R%C4%93%C4%B7ins%20-%20J%C4%81nis%20Bedeicis.pdf";

        const container =
            document.getElementById("pdf-container");

        const loading =
            document.getElementById("loading");

        const error =
            document.getElementById("error");

        try {

            const pdfjsLib =
                await import(
                    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.54/pdf.min.mjs"
                );

            pdfjsLib.GlobalWorkerOptions.workerSrc =
                "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.54/pdf.worker.min.mjs";

            const pdf =
                await pdfjsLib.getDocument(PDF_URL).promise;

            for (
                let pageNumber = 1;
                pageNumber <= pdf.numPages;
                pageNumber++
            ) {

                const page =
                    await pdf.getPage(pageNumber);

                const originalViewport =
                    page.getViewport({
                        scale: 1
                    });

                // Scale PDF to 100% browser width
                const scale =
                    window.innerWidth /
                    originalViewport.width;

                const viewport =
                    page.getViewport({
                        scale: scale
                    });

                const canvas =
                    document.createElement("canvas");

                canvas.className =
                    "pdf-page";

                const context =
                    canvas.getContext("2d");

                canvas.width =
                    viewport.width;

                canvas.height =
                    viewport.height;

                container.appendChild(canvas);

                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;
            }

            loading.style.display = "none";

        } catch (err) {

            console.error(
                "PDF loading error:",
                err
            );

            loading.style.display = "none";
            error.style.display = "block";
        }

    </script>
