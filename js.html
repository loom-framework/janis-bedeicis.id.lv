<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body style="margin:0">

<div id="pdf"></div>

<script type="module">
import * as pdfjsLib from
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.54/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.54/pdf.worker.min.mjs";

const pdf = await pdfjsLib.getDocument("https://www.janis-bedeicis.id.lv/BIZNESA_KONTAKTKARTE_JANIS_BEDEICIS.pdf").promise;
const container = document.getElementById("pdf");

for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 1.5 });

    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.width = "100%";
    canvas.style.height = "auto";

    container.appendChild(canvas);

    await page.render({
        canvasContext: canvas.getContext("2d"),
        viewport
    }).promise;
}
</script>

</body>
</html>
